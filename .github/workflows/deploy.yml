name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ailenshen/new-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve version
        run: |
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(git describe --tags --always)"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=$APP_VERSION"

      - name: Build web
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$APP_VERSION" bun run build

      - name: Build binary (linux/arm64)
        run: |
          mkdir -p dist
          GOWORK=off go mod download
          PGO_FILE="$(GOWORK=off go list -m -f '{{.Dir}}' github.com/MoeForge/moejs)/default.pgo"
          CGO_ENABLED=0 GOWORK=off GOOS=linux GOARCH=arm64 GOEXPERIMENT=greenteagc \
            go build -pgo="$PGO_FILE" \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$APP_VERSION'" \
            -o dist/new-api .

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload binary and unit file
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" dist/new-api "deploy@${{ secrets.DEPLOY_HOST }}:/opt/new-api/new-api.new"
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" deploy/systemd/new-api.service "deploy@${{ secrets.DEPLOY_HOST }}:/opt/new-api/new-api.service.new"

      - name: Swap binary, reload systemd, restart, health check
        run: |
          ssh -i ~/.ssh/id_ed25519 "deploy@${{ secrets.DEPLOY_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            sudo /usr/local/sbin/deploy-new-api swap-and-restart
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/api/status | grep -q '"success":true'; then
                exit 0
              fi
              sleep 2
            done
            echo "::error::new-api health check failed after restart"
            sudo /usr/local/sbin/deploy-new-api logs
            exit 1
          EOF

      - name: Publish nginx config
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" deploy/nginx/token.truestlens.com.conf "deploy@${{ secrets.DEPLOY_HOST }}:/opt/new-api/token.truestlens.com.nginx.new"
          ssh -i ~/.ssh/id_ed25519 "deploy@${{ secrets.DEPLOY_HOST }}" 'sudo /usr/local/sbin/deploy-new-api publish-nginx'
